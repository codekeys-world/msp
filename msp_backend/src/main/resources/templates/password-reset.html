<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Réinitialisation du mot de passe</title></head>
<body style="font-family:Arial,sans-serif;color:#19352a;line-height:1.6">
<h1>Réinitialisation de votre mot de passe</h1>
<p>Bonjour <span th:text="${username}">adhérent</span>,</p>
<p>Une demande de réinitialisation du mot de passe de votre compte MSP a été effectuée.</p>
<p><a th:href="${resetUrl}" style="display:inline-block;padding:12px 20px;background:#176640;color:#fff;text-decoration:none;border-radius:6px">Choisir un nouveau mot de passe</a></p>
<p>Ce lien expire dans 30 minutes. Si vous n'êtes pas à l'origine de cette demande, ignorez ce message.</p>
</body></html>
