# Configuration de la base de données PostgreSQL de Test
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:msp_test_db}
spring.datasource.username=${DB_USERNAME:msp_user}
spring.datasource.password=${DB_PASSWORD:test_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Stratégie Hibernate pour les tests (recrée la structure à chaque run)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration du service Mail pour les tests (Ici l'arobase ne pose aucun problème)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:test_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Réduit le bruit dans la console GitHub Actions
logging.level.org.flywaydb=warn
logging.level.org.springframework=info
spring.flyway.enabled=false

# Valeurs locales de test ; aucune variable de production n'est nécessaire.
# Clé Base64 de 256 bits réservée aux tests (JwtService utilise BASE64.decode).
application.security.token.secret-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
application.allowed.origins=http://localhost:4200
application.frontend.url=http://localhost:4200
application.file.upload=${java.io.tmpdir}/msp-test-fichiers
