spring.application.name=msp_backend
spring.profiles.active=${ACTIVE_PROFILE}

# Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# OpenAPI
springdoc.default-produces-media-type=application/json

# Server
server.port=8088
server.servlet.context-path=/api/v1

# Security
application.security.token.secret-key=${APPLICATION_TOKEN}
application.security.token.expiration=8640000
application.security.refresh-token.expiration=604800000

# Files
application.file.upload=${FILE_UPLOAD_PATH:/app/fichiers}
application.allowed.origins=${APPLICATION_ALLOWED_ORIGINS}

# JPA & Hibernate optimizations
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# Flyway owns schema changes; Hibernate only verifies the entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
