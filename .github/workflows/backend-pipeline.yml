name: Pipeline de déploiement du backend du projet de la mutuelle des surveillants de prison du Mali
on:
  push:
    branches:
      - develop
      - ci
      - main
    paths:
      - msp_backend/**
      - docker/backend/**
      - docker-compose.yml
      - .github/workflows/backend-pipeline.yml

jobs:
    compilation:
      runs-on: ubuntu-latest
      name: Compilation du projet
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: '0'
            clean: true
        - name: Setup JDK
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '17'
        - name: Complilation du projet
          run: |
            cd msp_backend
            chmod +x ./mvnw
            ./mvnw clean compile

    test-unitaire:
      name: Test unitaire du projet
      runs-on: ubuntu-latest
      services:
        postgres:
          image: postgres:15
          env:
            POSTGRES_DB: msp_test_db
            POSTGRES_USER: test@example.com
            POSTGRES_PASSWORD: test_password
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: '0'
            clean: true
        - name: Setup JDK
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '17'
        - name: Exécution des tests unitaires
          run: |
            cd msp_backend
            chmod +x ./mvnw
            ./mvnw clean test
          env:
            ACTIVE_PROFILE: test
            DB_HOST: localhost
            DB_PORT: 5432
            DB_NAME: msp_test_db
            DB_USERNAME: test@example.com
            DB_PASSWORD: test_password
