name: Pipeline de déploiement du backend du projet de la mutuelle des surveillants de prison du Mali
on:
  push:
    branches:
      - develop
      - ci
      - main
    paths:
      - msp_backend/**
      - documentation/**
      - docker/backend/**
      - docker-compose.yml
      - .github/workflows/backend-pipeline.yml

jobs:
  compilation:
    runs-on: ubuntu-latest
    name: Compilation du projet
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          clean: true
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Complilation du projet
        run: |
          cd msp_backend
          chmod +x ./mvnw
          ./mvnw clean compile

  test-unitaire:
    name: Test unitaire du projet
    runs-on: ubuntu-latest
    env:
      ACTIVE_PROFILE: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: msp_test_db
      DB_USERNAME: msp_user
      DB_PASSWORD: test_password
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: msp_test_db
          POSTGRES_USER: msp_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msp_user -d msp_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          clean: true
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Exécution des tests unitaires
        working-directory: msp_backend
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress -Dspring.profiles.active=test clean test
      - name: Rapports des tests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: msp_backend/target/surefire-reports/
          if-no-files-found: ignore
  build-project:
    runs-on: ubuntu-latest
    name: Build du projet backend
    needs:
      - compilation
      - test-unitaire
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          clean: true
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build du projet
        working-directory: msp_backend
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

  build-image:
    runs-on: ubuntu-latest
    name: Build et push de l'image docker du backend
    needs:
      - build-project
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          clean: true
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build du projet
        working-directory: msp_backend
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests
      - name: Extraire la version du projet
        run: |
          cd msp_backend
          VERSION=$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Connection à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/msp-api:${{ env.VERSION }},${{ secrets.DOCKERHUB_USERNAME }}/msp-api:latest

  deploiement:
    name: Déploiement du backend
    needs:
      - build-image
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          clean: true
      - name: Configuration SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts
      - name: Copie du fichier docker-compose et déploiement
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} "mkdir -p ~/msp-project"
          scp docker-compose.yml ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:~/msp-project/docker-compose.yml
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
          cd ~/msp-project
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml pull -q
          docker compose -f docker-compose.yml up -d --force-recreate
          EOF
        

