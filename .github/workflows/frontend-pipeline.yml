name: Pipeline de déploiement du frontend du projet de la mutuelle des surveillants de prison du Mali
on:
  push:
    branches:
      - develop
      - ci
      - main
    paths:
      - msp_frontend/**
      - documentation/**
      - docker/frontend/**
      - docker-compose.yml
      - .github/workflows/frontend-pipeline.yml

jobs:
    build-image:
      name: Build the frontend Docker image
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v5
          with:
            fetch-depth: 0
            clean: 'true'
        - name: Extract project version
          id: extract_version
          run: |
            cd msp_frontend
            echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT
        - name: Login to Dockerhub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build and push to Dockerhub
          uses: docker/build-push-action@v5
          with:
            context: msp_frontend
            file: docker/frontend/Dockerfile
            push: true
            platforms: linux/amd64
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/msp-front:${{ steps.extract_version.outputs.VERSION}},${{ secrets.DOCKERHUB_USERNAME }}/msp-front:latest

