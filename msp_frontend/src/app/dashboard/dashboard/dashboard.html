<div class="dashboard-theme">
    <app-sidebar [collapsed]="isMobile ? mobileMenuOpen : sidebarCollapsed" />
    @if (isMobile && mobileMenuOpen) {
        <button class="sidebar-backdrop" type="button" aria-label="Fermer le menu" (click)="closeMobileMenu()"></button>
    }
    <!-- MAIN CONTENT -->
    <div class="main-content" [class.sidebar-collapsed]="!isMobile && sidebarCollapsed">
        <!-- TOP BAR -->
        <app-navbar [menuOpen]="isMobile ? mobileMenuOpen : !sidebarCollapsed" (toggleSidebar)="toggleSidebar()" />
       

        <!-- CONTENT -->
        <div class="content-area fade-in">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
