<section class="container-fluid py-4">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-1">{{ slug() ? 'Modifier le matériel' : 'Nouveau matériel' }}</h2>
          <p class="text-muted mb-0">Suivi du matériel du trésor et du système.</p>
        </div>
        <button class="btn btn-outline-secondary" type="button" (click)="router.navigate(['dashboard', 'materiels'])" [disabled]="isSubmitting()">
          Retour
        </button>
      </div>

      @if (isLoading()) {
        <div class="text-center py-5" role="status">
          <span class="spinner-border text-success" aria-hidden="true"></span>
          <p class="text-muted mt-2 mb-0">Chargement du matériel…</p>
        </div>
      } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input class="form-control" formControlName="nom" placeholder="Ex. Ordinateur portable" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Catégorie</label>
            <input class="form-control" formControlName="categorie" placeholder="Ex. Informatique, mobilier…" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Fournisseur</label>
            <input class="form-control" formControlName="fournisseur" placeholder="Nom du fournisseur" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Quantité</label>
            <input class="form-control" type="number" min="0" formControlName="quantite" placeholder="Ex. 1" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Prix unitaire (FCFA)</label>
            <input class="form-control" type="number" min="0" step="100" formControlName="prixUnitaire" placeholder="Ex. 250000" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Date d’acquisition</label>
            <input class="form-control" type="date" formControlName="dateAcquisition" placeholder="Date d’acquisition" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Emplacement</label>
            <input class="form-control" formControlName="emplacement" placeholder="Ex. Bureau de la trésorerie" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Numéro de série</label>
            <input class="form-control" formControlName="numeroSerie" placeholder="Numéro de série (facultatif)" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Statut</label>
            <select class="form-select" formControlName="statut">
              <option value="" disabled>Choisir un statut</option>
              <option value="ACTIF">Actif</option>
              <option value="EN_MAINTENANCE">En maintenance</option>
              <option value="HORS_SERVICE">Hors service</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Observation</label>
            <textarea class="form-control" rows="4" formControlName="observation" placeholder="Détails ou remarques sur le matériel (facultatif)"></textarea>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <button class="btn btn-outline-secondary" type="button" (click)="router.navigate(['dashboard', 'materiels'])" [disabled]="isSubmitting()">Annuler</button>
          <button class="btn btn-success" type="submit" [disabled]="isSubmitting()">
            @if (isSubmitting()) { <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span> }
            {{ isSubmitting() ? 'Enregistrement…' : (slug() ? 'Enregistrer les modifications' : 'Créer le matériel') }}
          </button>
        </div>
      </form>
      }
    </div>
  </div>
</section>
