 <!-- TOP BAR -->
<div class="top-bar">
    <div class="d-flex align-items-center gap-2">
                <button
        class="btn btn-outline-secondary btn-sm"
        title="Réduire/Agrandir"
        (click)="onToggleSidebar()"
        >
        <i class="fas fa-bars" style="font-size:1.2rem"></i>
        </button>
        <div>
        <h6 class="mb-0 fw-bold">Tableau de bord</h6>
        <small class="text-muted" id="current-date"></small>
        </div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <!--<button class="btn btn-outline-primary btn-sm" onclick="downloadZip()">
            <i class="bi bi-download me-1"></i> Telecharger ZIP
        </button>-->
        <div class="user-dropdown">
            <button class="btn btn-link dropdown-toggle p-0 d-flex align-items-center gap-2 text-decoration-none text-dark" data-bs-toggle="dropdown" aria-expanded="false">
<!--              <i class="bi bi-person-circle me-2" aria-hidden="true"></i>-->
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:36px;height:36px;font-size:0.85rem">
                        {{initialeName()}}
                    </div>
                    <div class="d-none d-md-block">
                        <small class="fw-semibold d-block">
                            {{fullName()}}
                        </small>
                        <small class="text-muted" style="font-size:0.7rem">
                            {{roleName}}
                        </small>
                    </div>
                </button>
                <ul class="dropdown-menu">
                    <li>
                        <a class="dropdown-item user-dropdown-item" href="/dashboard/profil" (click)="onProfileClick($event)">
                            <i class="fas fa-user-circle me-2" aria-hidden="true"></i>Profil
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item user-dropdown-item" (click)="onLogout()">
                            <i class="fas fa-sign-out-alt"></i>
                            Deconnexion
                        </a>
                    </li>
                </ul>
        </div>
    </div>
</div>
